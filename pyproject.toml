[project]
# Must differ from the libs/ package name, even with "-" and "_" treated as equal.
# Example: package my_project, root project my-project-analysis.
name = "project-name"
version = "0.1.0"
description = "Project description"
requires-python = ">=3.12"
dependencies = [
    "project_package_name",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "python-dotenv",
    "snakemake",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
]

[tool.uv.sources]
project_package_name = { path = "libs", editable = true }
